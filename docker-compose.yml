services:
  product-service:
    build: ./services/product-service
    ports:
      - "5002:5002"
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  gateway:
    build: ./gateway
    ports:
      - "5000:5000"
    env_file:
      - ./gateway/.env
    environment:
      REDIS_URL: redis://redis:6379
      PRODUCT_SERVICE_URL: http://product-service:5002
    depends_on:
      - redis
      - product-service